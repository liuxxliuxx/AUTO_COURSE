<!doctype html>
<!--
  传统智慧树课程页夹具 —— 覆盖 src/constants.py 中传统课程相关的全部选择器：
    li.video / .small-lesson / .catalogue_title / .time_icofinish / li.video.current_play
    div.dialog-read（学前必读）/ .ss2077-msg-custom（学习进度提醒）
    video / .vjs-big-play-button / button.vjs-play-control
  以及转录链路需要的 MediaRecorder + captureStream + download。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>传统课程 · 夹具</title>
    <style>
      body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
      #sidebar { width: 320px; border-right: 1px solid #ddd; overflow: auto; }
      ul { list-style: none; margin: 0; padding: 0; }
      li.video { padding: 10px 12px; border-bottom: 1px solid #eee; cursor: pointer; }
      li.video.current_play { background: #e8f4ff; }
      .time_icofinish { color: #2a2; font-size: 12px; }
      .small-lesson { font-weight: 700; background: #f6f6f6; }
      #stage { flex: 1; padding: 16px; }
      #load-more { margin: 8px; }
      .dialog-read, .ss2077-msg-custom {
        position: fixed; inset: 0; background: rgba(0,0,0,.4);
        display: flex; align-items: center; justify-content: center;
      }
      .dialog-read .box, .ss2077-msg-custom .box { background: #fff; padding: 24px; }
    </style>
  </head>
  <body>
    <aside id="sidebar">
      <ul id="video-list">
        <li class="video">
          <span class="catalogue_title">1.1 绪论</span>
          <i class="time_icofinish">已学完</i>
        </li>
        <li class="video current_play">
          <span class="catalogue_title">1.2 艺术的起源</span>
        </li>
        <li class="video">
          <span class="catalogue_title">1.3 审美与形式</span>
        </li>
        <li class="video small-lesson">
          <span class="catalogue_title">第二章 章节导语</span>
        </li>
        <li class="video">
          <span class="catalogue_title">2.1 绘画语言</span>
          <i class="time_icofinish">已学完</i>
        </li>
        <li class="video">
          <span class="catalogue_title">2.2 雕塑与空间</span>
        </li>
      </ul>
      <button id="load-more">加载更多</button>
      <div id="late-host"></div>
    </aside>

    <main id="stage">
      <h1 id="course-title">艺术与审美</h1>

      <!--
        用预生成的静态媒体而不是运行时 MediaRecorder 合成：
        MediaRecorder 产出的 WebM 头部不带 duration，Chrome 读到的是 NaN，
        断言 duration 的测试会一直等不到。静态文件是确定性的。
      -->
      <video id="courseVideo" width="320" height="180" loop muted src="/assets/tiny.webm"></video>

      <div class="vjs-big-play-button" id="bigPlay">▶</div>
      <button class="vjs-play-control" id="playControl">play</button>

      <p>
        <a id="download-link" href="#" download="poc-download.txt">下载附件（blob）</a>
        <a id="http-download-link" href="/attachment/course-material.pdf" download>下载附件（HTTP）</a>
      </p>
    </main>

    <script>
      // ---- 侧边栏：模拟点击切换 current_play ----
      const list = document.getElementById('video-list')
      list.addEventListener('click', (ev) => {
        const li = ev.target.closest('li.video')
        if (!li || li.classList.contains('small-lesson')) return
        for (const el of list.querySelectorAll('li.video')) el.classList.remove('current_play')
        li.classList.add('current_play')
      })

      // ---- 动态插入（模拟 SPA 懒加载）----
      document.getElementById('load-more').addEventListener('click', () => {
        setTimeout(() => {
          const li = document.createElement('li')
          li.className = 'video late-item'
          li.innerHTML = '<span class="catalogue_title">3.1 延迟加载的章节</span>'
          list.appendChild(li)
        }, 300)
      })

      // ---- 会话存储（验证 storage 可用）----

      // ---- 媒体就绪标记（供测试等待）----
      const mediaVideo = document.getElementById('courseVideo')
      mediaVideo.addEventListener('loadedmetadata', () => {
        window.__mediaReady = true
      })
      mediaVideo.addEventListener('error', () => {
        window.__mediaError = String(mediaVideo.error?.message ?? 'media load error')
      })
      if (mediaVideo.readyState >= 1) window.__mediaReady = true

      // ---- 下载：用 blob URL 触发真实 download 事件 ----
      document.getElementById('download-link').addEventListener('click', (ev) => {
        ev.preventDefault()
        const blob = new Blob(['poc download payload'], { type: 'text/plain' })
        const a = ev.currentTarget
        a.href = URL.createObjectURL(blob)
        a.click()
      })

      // ---- 验证码：默认休眠，测试里显式唤起 ----
      window.__showCaptcha = () => {
        document.getElementById('captchaLive').hidden = false
      }
      window.__hideCaptcha = () => {
        document.getElementById('captchaLive').hidden = true
      }

      // ---- 播放按钮 ----
      const video = document.getElementById('courseVideo')
      document.getElementById('bigPlay').addEventListener('click', () => video.play())
      document.getElementById('playControl').addEventListener('click', () => {
        if (video.paused) video.play()
        else video.pause()
      })
    </script>

    <!--
      真实站点会长期在 DOM 里挂一个**休眠的验证码容器**（v1 注释里叫 #captchaYidun）。
      它没弹出来，但 iframe 一直在。Selenium 的 is_displayed() 会跳过它；
      只看 getBoundingClientRect() 的实现会误报成"检测到验证码"。
      下面把几种常见的隐藏方式各放一个，作为误报回归用例。

      全部用 position:fixed —— 真实 yidun 弹窗就是这么定位的，
      同时也让它们脱离 body 的 flex 布局，不干扰其它用例。
    -->
    <div id="captchaYidun" style="position: fixed; left: 0; top: 0; width: 300px; height: 150px; visibility: hidden">
      <iframe src="https://cstaticdun.126.net/2.2.4/load.min.js?hidden-by-visibility"></iframe>
    </div>

    <div id="captchaHiddenOpacity" style="position: fixed; left: 0; top: 0; width: 300px; height: 150px; opacity: 0; pointer-events: none">
      <iframe src="https://cstaticdun.126.net/2.2.4/load.min.js?hidden-by-opacity"></iframe>
    </div>

    <div id="captchaClipped" style="position: fixed; left: 0; top: 0; width: 0; height: 0; overflow: hidden">
      <iframe src="https://cstaticdun.126.net/2.2.4/load.min.js?clipped-away"></iframe>
    </div>

    <div id="captchaOffscreen" style="position: fixed; left: -9999px; top: 0; width: 300px; height: 150px">
      <iframe src="https://cstaticdun.126.net/2.2.4/load.min.js?parked-offscreen"></iframe>
    </div>

    <div id="captchaHiddenDisplay" style="position: fixed; display: none">
      <iframe src="https://cstaticdun.126.net/2.2.4/load.min.js?hidden-by-display"></iframe>
    </div>

    <!-- 与之对应：一个真的弹出来的验证码（确认修了误报之后仍然检得出来） -->
    <div
      id="captchaLive"
      class="yidun_popup"
      hidden
      style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 320px; height: 220px; background: #fff; border: 1px solid #ddd"
    >
      <div id="tcaptcha_transform_dy" style="height: 60px; background: #eee"></div>
    </div>
  </body>
</html>
