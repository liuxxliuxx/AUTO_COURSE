<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PoC 冒烟页</title>
    <style>
      body { font-family: sans-serif; padding: 24px; }
    </style>
  </head>
  <body>
    <h1 id="title">PoC 冒烟页</h1>

    <input id="name" placeholder="姓名" />

    <button id="pick" onclick="this.dataset.clicked='1'">点击我</button>
    <button id="spawn">插入动态元素</button>
    <div id="host"></div>

    <iframe id="child" srcdoc="<body style='font-family:sans-serif'>
      <div id='inner'>iframe 内部</div>
      <input id='inner-input' />
    </body>"></iframe>

    <video id="v" width="160" height="90"></video>

    <script>
      document.getElementById('spawn').addEventListener('click', () => {
        setTimeout(() => {
          const el = document.createElement('div')
          el.id = 'late'
          el.textContent = '延迟插入的内容'
          document.getElementById('host').appendChild(el)
        }, 400)
      })
    </script>
  </body>
</html>
