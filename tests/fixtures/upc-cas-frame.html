<!doctype html>
<!--
  UPC CAS 登录 iframe 的**内容页**（由 upc-cas.html 内嵌）。

  复刻真实站点：Vant UI 表单是一个 Vue 组件，upc.py 通过
  `document.querySelector('#app').__vue__` 拿到实例，
  写入 username / password 后调用 passwordLogin()。

  这里用一个等价对象替代真实 Vue 实例，保留相同三个成员。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #eef1f6;
      }
      .van-form { width: 320px; background: #fff; padding: 28px; border-radius: 8px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-bottom: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #1867c0;
        color: #fff;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      #state { margin-top: 10px; font-size: 12px; color: #666; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="van-form">
        <input id="username" placeholder="统一认证账号" />
        <input id="password" type="password" placeholder="密码" />
        <button id="submit">登录</button>
        <div id="state">idle</div>
      </div>
    </div>

    <script>
      const el = document.getElementById('app')

      // 与真实 Vue 组件等价的实例
      el.__vue__ = {
        username: '',
        password: '',
        passwordLogin() {
          document.getElementById('username').value = this.username
          document.getElementById('password').value = this.password
          document.getElementById('state').textContent = 'submitted'
        }
      }

      // 手动提交走同一条路径，方便对照
      document.getElementById('submit').addEventListener('click', () => {
        el.__vue__.passwordLogin()
      })
    </script>
  </body>
</html>
